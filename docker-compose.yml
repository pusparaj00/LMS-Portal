name: lms

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://lms_api:${LMS_API_DB_PASSWORD:?set in .env}@db:5432/lms
  REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set in .env}
  MASTERY_SERVICE_URL: http://mastery:8001
  MASTERY_SERVICE_TOKEN: ${MASTERY_SERVICE_TOKEN:?set in .env}
  JOBS_DIR: /jobs
  CHAT_DATABASE_URL: postgresql+psycopg://lms_chat:${LMS_CHAT_DB_PASSWORD:?set in .env}@db:5432/lms
  ROUTER_MIN_CONFIDENCE: ${ROUTER_MIN_CONFIDENCE:-0.6}
  CHAT_HISTORY_TURNS: ${CHAT_HISTORY_TURNS:-6}
  LLM_PROVIDER: ${LLM_PROVIDER:-stub}
  LLM_MODEL: ${LLM_MODEL:-stub}
  LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-12}
  LLM_BUDGET_S: ${LLM_BUDGET_S:-20}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  LLM_THINKING_BUDGET: ${LLM_THINKING_BUDGET:-0}
  RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.67}
  RETENTION_DAYS: ${RETENTION_DAYS:-0}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
  TOOL_BASE_URL: ${TOOL_BASE_URL:-http://localhost:8080}
  LTI_KEYS_TIMEOUT_S: ${LTI_KEYS_TIMEOUT_S:-5}

# The tests never touch the app's data: they run against their own database (lms_test, on the same Postgres server),
# their own Redis database number, and their own copies of the mastery service and the worker (TR-A-01, TR-V-10).
x-test-env: &test-env
  OWNER_DATABASE_URL: postgresql+psycopg://lms_owner:${POSTGRES_PASSWORD:?set in .env}@db:5432/lms_test
  DATABASE_URL: postgresql+psycopg://lms_api:${LMS_API_DB_PASSWORD:?set in .env}@db:5432/lms_test
  MASTERY_DATABASE_URL: postgresql+psycopg://lms_mastery:${LMS_MASTERY_DB_PASSWORD:?set in .env}@db:5432/lms_test
  CHAT_DATABASE_URL: postgresql+psycopg://lms_chat:${LMS_CHAT_DB_PASSWORD:?set in .env}@db:5432/lms_test
  REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/1
  MASTERY_SERVICE_URL: http://mastery-test:8001
  LMS_API_DB_PASSWORD: ${LMS_API_DB_PASSWORD:?set in .env}
  LMS_MASTERY_DB_PASSWORD: ${LMS_MASTERY_DB_PASSWORD:?set in .env}
  LMS_CHAT_DB_PASSWORD: ${LMS_CHAT_DB_PASSWORD:?set in .env}

services:
  db:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: lms_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: lms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_owner -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      OWNER_DATABASE_URL: postgresql+psycopg://lms_owner:${POSTGRES_PASSWORD:?set in .env}@db:5432/lms
      LMS_API_DB_PASSWORD: ${LMS_API_DB_PASSWORD:?set in .env}
      LMS_MASTERY_DB_PASSWORD: ${LMS_MASTERY_DB_PASSWORD:?set in .env}
      LMS_CHAT_DB_PASSWORD: ${LMS_CHAT_DB_PASSWORD:?set in .env}
    depends_on:
      db:
        condition: service_healthy

  sandbox:
    restart: unless-stopped
    build: ./sandbox
    init: true
    network_mode: none
    read_only: true
    user: root
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    # SANDBOX_WORKERS jobs run at once; each run may use 256 MiB of address space and 2 s of CPU, so these two limits
    # are sized for four at a time.
    mem_limit: 1536m
    cpus: 4.0
    environment:
      SANDBOX_WORKERS: 4
    tmpfs:
      - /work:size=64m,mode=0711,noexec,nosuid,nodev
      - /tmp:size=8m,noexec,nosuid,nodev
    volumes:
      - jobs:/jobs
    healthcheck:
      test: ["CMD", "python3", "-c", "import time;assert time.time()-float(open('/jobs/heartbeat').read())<5"]
      interval: 5s
      timeout: 3s
      retries: 10

  mastery:
    restart: unless-stopped
    build: ./backend
    command: ["uvicorn", "app.mastery.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MASTERY_DATABASE_URL: postgresql+psycopg://lms_mastery:${LMS_MASTERY_DB_PASSWORD:?set in .env}@db:5432/lms
      MASTERY_SERVICE_TOKEN: ${MASTERY_SERVICE_TOKEN:?set in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  worker:
    restart: unless-stopped
    build: ./backend
    command: ["python", "-m", "app.worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://lms_api:${LMS_API_DB_PASSWORD:?set in .env}@db:5432/lms
      REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
      MASTERY_SERVICE_URL: http://mastery:8001
      MASTERY_SERVICE_TOKEN: ${MASTERY_SERVICE_TOKEN:?set in .env}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mastery:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time, redis; v = redis.Redis.from_url(os.environ['REDIS_URL']).get('worker:heartbeat'); assert v and time.time() - float(v) < 20"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    restart: unless-stopped
    build: ./backend
    environment:
      <<: *backend-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LTI_TOOL_PRIVATE_KEY: ${LTI_TOOL_PRIVATE_KEY:-}
      GEMINI_PRO_API_KEY: ${GEMINI_PRO_API_KEY:-}
      LLM_MODEL_GEMINI: ${LLM_MODEL_GEMINI:-gemini-3.5-flash-lite}
      LLM_MODEL_GEMINI_PRO: ${LLM_MODEL_GEMINI_PRO:-gemini-3.5-flash-lite}
      LLM_FALLBACK: ${LLM_FALLBACK:-}
      GROQCLOUD_API_KEY: ${GROQCLOUD_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LLM_MODEL_LOCAL: ${LLM_MODEL_LOCAL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
      DEMO_INSTRUCTOR_PASSWORD: ${DEMO_INSTRUCTOR_PASSWORD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jobs:/jobs
      - ./data:/srv/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy
      mastery:
        condition: service_healthy
      worker:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  frontend:
    restart: unless-stopped
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6

  testdb:
    profiles: ["test"]
    build: ./backend
    command: ["python", "-m", "tests.prepare_db"]
    environment:
      <<: *test-env
    depends_on:
      db:
        condition: service_healthy

  mastery-test:
    profiles: ["test"]
    build: ./backend
    command: ["uvicorn", "app.mastery.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MASTERY_DATABASE_URL: postgresql+psycopg://lms_mastery:${LMS_MASTERY_DB_PASSWORD:?set in .env}@db:5432/lms_test
      MASTERY_SERVICE_TOKEN: ${MASTERY_SERVICE_TOKEN:?set in .env}
    depends_on:
      testdb:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  worker-test:
    profiles: ["test"]
    build: ./backend
    command: ["python", "-m", "app.worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://lms_api:${LMS_API_DB_PASSWORD:?set in .env}@db:5432/lms_test
      REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/1
      MASTERY_SERVICE_URL: http://mastery-test:8001
      MASTERY_SERVICE_TOKEN: ${MASTERY_SERVICE_TOKEN:?set in .env}
      RETENTION_DAYS: "0"
      AUDIT_RETENTION_DAYS: "0"
    depends_on:
      testdb:
        condition: service_completed_successfully
      mastery-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time, redis; v = redis.Redis.from_url(os.environ['REDIS_URL']).get('worker:heartbeat'); assert v and time.time() - float(v) < 20"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  test:
    profiles: ["test"]
    build: ./backend
    command: ["sh", "-c", "ruff check . && pytest -q"]
    environment:
      <<: [*test-env, *backend-env]
      LLM_PROVIDER: stub
      LLM_MODEL: stub
      MASTERY_SERVICE_TOKEN: ${MASTERY_SERVICE_TOKEN:?set in .env}
    volumes:
      - jobs:/jobs
      - ./data:/srv/data:ro
    depends_on:
      mastery-test:
        condition: service_healthy
      worker-test:
        condition: service_healthy
      sandbox:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  jobs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m
