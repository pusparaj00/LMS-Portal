server {
  listen 8080;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    client_max_body_size 6m;  # for a PDF notes upload; the API enforces its own, tighter limit everywhere else
    proxy_pass http://api:8000;
    # The API waits up to 12 s per test plus 15 s for the sandbox; a problem may have 50 tests (backend/app/sandbox.py).
    proxy_read_timeout 660s;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Built files carry a hash in their name, so they can be cached for good; the page itself must not be.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
