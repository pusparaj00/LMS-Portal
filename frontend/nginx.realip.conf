# TR-O-03: production only (mounted by compose.prod.yml). In production only the proxy container reaches this server,
# and the proxy puts the client address it saw in X-Forwarded-For, so nginx adopts it as $remote_addr. Docker draws its
# networks from all three private ranges (a server with many networks gets 192.168.x.x or 10.x.x.x ones), and if the
# proxy's address were outside the trusted range every user would share its rate-limit bucket.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
