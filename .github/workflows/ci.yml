name: ci

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (working tree and history)
        run: python3 backend/evaluation/secret_scan.py
      - name: Create a throwaway .env with random secrets
        run: |
          {
            for name in POSTGRES_PASSWORD LMS_API_DB_PASSWORD LMS_MASTERY_DB_PASSWORD REDIS_PASSWORD JWT_SECRET MASTERY_SERVICE_TOKEN LMS_CHAT_DB_PASSWORD; do
              echo "$name=$(openssl rand -hex 20)"
            done
          } > .env
      - run: docker compose up -d --build --wait
      - run: docker compose --profile test run --rm test
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose --profile test down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
