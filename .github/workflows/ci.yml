name: ci

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lms_owner
          POSTGRES_PASSWORD: ci-only-owner
          POSTGRES_DB: lms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms_owner -d lms" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      OWNER_DATABASE_URL: postgresql+psycopg://lms_owner:ci-only-owner@localhost:5432/lms
      DATABASE_URL: postgresql+psycopg://lms_api:ci-only-api@localhost:5432/lms
      MASTERY_DATABASE_URL: postgresql+psycopg://lms_mastery:ci-only-mastery@localhost:5432/lms
      REDIS_URL: redis://localhost:6379/0
      LMS_API_DB_PASSWORD: ci-only-api
      LMS_MASTERY_DB_PASSWORD: ci-only-mastery
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
